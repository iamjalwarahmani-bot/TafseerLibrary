<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading Tafseer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital@0;1&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory: #FAF6ED;
    --card: #F1EAD9;
    --ink: #2E2A22;
    --ink-soft: #5B5647;
    --sage: #1C7A6E;
    --olive: #0E4B45;
    --line: rgba(14,75,69,0.18);
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html, body{
    height: 100%;
    background: var(--ivory);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
  }

  .frame{
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--ivory);
  }

  .back-link{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
    color: var(--ink-soft);
    font-size: 0.85rem;
    flex-shrink: 0;
  }

  .back-link svg{ width:14px; height:14px; }

  .surah-title{
    font-family: 'Amiri', serif;
    font-style: italic;
    font-size: 1.05rem;
    color: var(--olive);
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .viewer-wrap{
    flex: 1;
    padding: 12px;
    min-height: 0;
  }

  iframe{
    width: 100%;
    height: 100%;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--card);
  }

  .empty{
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    text-align: center;
    padding: 40px;
  }

  .empty p{
    color: var(--ink-soft);
    max-width: 30ch;
  }

  .empty a{
    text-decoration: none;
    background: var(--olive);
    color: var(--ivory);
    padding: 12px 22px;
    border-radius: 999px;
    font-size: 0.9rem;
  }
</style>
</head>
<body>

  <div class="frame">
    <header>
      <a class="back-link" href="surahs.html">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Surah List
      </a>
      <div class="surah-title" id="surahTitle"></div>
    </header>

    <div class="viewer-wrap" id="viewerWrap"></div>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const rawSrc = params.get('src');
  const name = params.get('name');
  const number = params.get('number');

  if(name){
    document.getElementById('surahTitle').textContent =
      number ? `${number}. ${name}` : name;
  }
  document.title = name ? `${name} — Tafseer` : "Reading Tafseer";

  const wrap = document.getElementById('viewerWrap');

  if(rawSrc){
    // If it's a normal Google Drive share link, convert it to the embeddable preview link automatically.
    const driveMatch = rawSrc.match(/\/d\/([a-zA-Z0-9_-]+)/);
    const embedSrc = driveMatch
      ? `https://drive.google.com/file/d/${driveMatch[1]}/preview`
      : rawSrc;

    const iframe = document.createElement('iframe');
    iframe.src = embedSrc;
    iframe.allow = "autoplay";
    wrap.appendChild(iframe);
  } else {
    wrap.innerHTML = `
      <div class="empty">
        <p>No Tafseer was selected to open.</p>
        <a href="surahs.html">Back to Surah List</a>
      </div>
    `;
  }
</script>

</body>
</html>
