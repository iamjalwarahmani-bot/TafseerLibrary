<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surah-wise Tafseer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital@0;1&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory: #FAF6ED;
    --card: #F1EAD9;
    --ink: #2E2A22;
    --ink-soft: #5B5647;
    --sage: #1C7A6E;
    --olive: #0E4B45;
    --brass: #B08D57;
    --line: rgba(14,75,69,0.18);
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  body{
    background: var(--ivory);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    font-weight: 400;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .page{
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  .back-link{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
    color: var(--ink-soft);
    font-size: 0.85rem;
    margin-bottom: 22px;
  }

  .back-link svg{ width:14px; height:14px; }

  h1{
    font-family: 'Amiri', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 2rem;
    color: var(--olive);
    margin-bottom: 6px;
  }

  .subtitle{
    color: var(--ink-soft);
    font-size: 0.92rem;
    font-weight: 300;
    margin-bottom: 24px;
  }

  .search-box{
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 13px 20px;
    margin-bottom: 28px;
    position: sticky;
    top: 12px;
    z-index: 5;
  }

  .search-box svg{
    width: 17px;
    height: 17px;
    color: var(--ink-soft);
    flex-shrink: 0;
  }

  .search-box input{
    border: none;
    background: transparent;
    outline: none;
    font-family: 'Work Sans', sans-serif;
    font-size: 0.95rem;
    color: var(--ink);
    width: 100%;
  }

  .search-box input::placeholder{
    color: var(--ink-soft);
    opacity: 0.7;
  }

  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }

  .card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: transform 0.15s ease;
  }

  .card.hidden{ display: none; }

  .number{
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--ivory);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Amiri', serif;
    font-style: italic;
    font-size: 1rem;
    color: var(--olive);
  }

  .card-body{
    flex: 1;
    min-width: 0;
  }

  .surah-name{
    font-family: 'Amiri', serif;
    font-style: italic;
    font-size: 1.15rem;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .status-available{
    display: inline-block;
    margin-top: 6px;
    text-decoration: none;
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--ivory);
    background: var(--olive);
    padding: 6px 14px;
    border-radius: 999px;
    transition: background 0.2s ease;
  }

  @media (hover:hover){
    .status-available:hover{ background: var(--sage); }
  }

  .status-soon{
    display: inline-block;
    margin-top: 6px;
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--ink-soft);
    background: transparent;
    border: 1px solid var(--line);
    padding: 5px 13px;
    border-radius: 999px;
    opacity: 0.75;
  }

  .empty-state{
    text-align: center;
    color: var(--ink-soft);
    padding: 40px 0;
    font-size: 0.95rem;
    display: none;
  }
</style>
</head>
<body>

  <div class="page">

    <a class="back-link" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Home
    </a>

    <h1>Surah-wise Tafseer</h1>
    <p class="subtitle">All 114 Surahs — read the ones that are ready.</p>

    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.6"/>
        <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Search by name or number">
    </div>

    <div class="grid" id="grid"></div>
    <p class="empty-state" id="emptyState">No Surah matches your search.</p>

  </div>

     4. Save the file. That Surah will automatically switch from
        "Coming Soon" to "Read Tafseer" — nothing else to change.

    {number:112, name:"Al-Ikhlas", pdf:""},
    {number:113, name:"Al-Falaq", pdf:""},
    {number:114, name:"An-Nas", pdf:""}
  ];

  const grid = document.getElementById('grid');
  const emptyState = document.getElementById('emptyState');

  function render(list){
    grid.innerHTML = "";
    list.forEach(s => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.name = s.name.toLowerCase();
      card.dataset.number = s.number;

      const statusHtml = s.pdf.trim()
        ? `<a class="status-available" href="reader.html?src=${encodeURIComponent(s.pdf)}&name=${encodeURIComponent(s.name)}&number=${s.number}">Read Tafseer</a>`
        : `<span class="status-soon">Coming Soon</span>`;

      card.innerHTML = `
        <div class="number">${s.number}</div>
        <div class="card-body">
          <div class="surah-name">${s.name}</div>
          ${statusHtml}
        </div>
      `;
      grid.appendChild(card);
    });
  }

  function filterCards(){
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    let visibleCount = 0;
    document.querySelectorAll('.card').forEach(card => {
      const match = card.dataset.name.includes(q) || card.dataset.number.includes(q);
      card.classList.toggle('hidden', !match);
      if(match) visibleCount++;
    });
    emptyState.style.display = visibleCount === 0 ? 'block' : 'none';
  }

  render(surahs);
  document.getElementById('searchInput').addEventListener('input', filterCards);
</script>

</body>
</html>
